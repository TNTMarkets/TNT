name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Fake values: compose and the api won't start without them
  POSTGRES_PASSWORD: ci
  BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
  INTRA42_CLIENT_ID: ci
  INTRA42_CLIENT_SECRET: ci

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Checkout main's migrations
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          sparse-checkout: apps/api/drizzle
          persist-credentials: false
      - name: Migrations vs main
        if: github.event_name == 'pull_request'
        run: |
          mv base "$RUNNER_TEMP/base"
          pnpm --filter @tnt/api check:migrations "$RUNNER_TEMP/base/apps/api/drizzle" drizzle
      - name: Migrations match the schema
        run: |
          pnpm --filter @tnt/api db:generate
          if [ -n "$(git status --porcelain apps/api/drizzle)" ]; then
            echo "The schema changed without a migration: run pnpm --filter @tnt/api db:generate --name=<what_changed> and commit it."
            exit 1
          fi
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Integration tests
        run: pnpm test:integration
      - name: Screenshot tests
        run: pnpm test:screenshots
      - name: Screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-diffs
          path: apps/web/.vitest/attachments/
          retention-days: 7
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @tnt/web exec playwright install --with-deps
      - name: Compose up
        run: docker compose up --build --detach --wait
      - name: Web app over HTTPS
        run: curl --fail --silent --insecure https://localhost:8443/ | grep -q '<div id="root">'
      - name: Api through the proxy
        run: curl --fail --silent --insecure https://localhost:8443/api/health
      - name: E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: https://localhost:8443
      - name: E2E report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report/
          retention-days: 7
      - name: Logs
        if: failure()
        run: docker compose logs
