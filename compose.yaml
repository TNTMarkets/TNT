name: tnt

x-postgres-credentials: &postgres-credentials
  POSTGRES_USER: ${POSTGRES_USER:-tnt}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (scripts/setup.sh creates one)}
  POSTGRES_DB: ${POSTGRES_DB:-tnt}

services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "src/migrate.ts"]
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: db
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:' + (process.env.PORT ?? 3000) + '/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

  db:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    restart: unless-stopped
    environment: *postgres-credentials
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # -h localhost: over the network Postgres answers only after it has created the user and database
      test: pg_isready -h localhost -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - certs:/etc/nginx/certs
    depends_on:
      - api

  screenshots:
    build: apps/web/test/screenshot-server
    platform: linux/amd64
    profiles: [screenshots]
    init: true
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: node -e "require('net').connect(3001).on('connect', () => process.exit(0)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  certs:
  db-data:
