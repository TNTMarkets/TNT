packages:
  - apps/*
  - packages/*

catalog:
  '@babel/core': ^8.0.9
  '@eslint/js': ^10.0.1
  # Exact: must match the Playwright server image in apps/web/test/screenshot-server/Dockerfile
  '@playwright/test': 1.64.1
  '@rolldown/plugin-babel': ^0.2.4
  '@storybook/addon-vitest': ^10.6.5
  '@storybook/react-vite': ^10.6.5
  '@tailwindcss/vite': ^4.3.3
  '@testcontainers/postgresql': ^12.2.1
  '@types/express': ^5.0.6
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitest/browser-playwright': ^5.0.5
  babel-plugin-react-compiler: ^1.0.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint: ^10.13.0
  eslint-config-prettier: ^10.1.8
  eslint-import-resolver-typescript: 4.4.5
  eslint-plugin-boundaries: 7.2.1
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-react-refresh: ^0.5.7
  express: ^5.3.0
  lefthook: ^2.2.2
  # Exact, same as @playwright/test
  playwright: 1.64.1
  postgres: ^4.0.0
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.3.1
  react-dom: ^19.3.1
  storybook: ^10.6.5
  tailwindcss: ^4.3.3
  typescript: 6.0.3
  typescript-eslint: ^8.72.1
  vite: ^8.3.5
  vitest: ^5.0.5
  zod: ^4.6.7
catalogMode: strict

engineStrict: true
strictDepBuilds: true

peerDependencyRules:
  allowedVersions:
    # jsx-a11y 6.10.2 works with ESLint 10 but doesn't declare it yet; remove once it does (jsx-eslint/eslint-plugin-jsx-a11y#1081).
    eslint-plugin-jsx-a11y>eslint: "10"

allowBuilds:
  lefthook: false
  # Come with Testcontainers, tests don't need their build scripts
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Comes with Storybook, its binary comes from a platform package
  esbuild: false
